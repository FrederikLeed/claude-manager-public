# Claude Manager network proxy — per-container domain allowlists
# Squid handles CONNECT (HTTPS tunneling) by SNI — no MITM needed.

# Core settings
http_port 3128
# Access log in a compact format the manager parses to attribute DENIED
# requests to instances (server/proxy-log.js):
#   cm <client-ip> <squid-result>/<http-status> <method> <url-or-host:port>
# Squid runs as 'proxy' and can't open /dev/stdout, so it writes a file that
# watch-acls.sh streams to docker logs (tail -F) and rotates hourly.
logformat cm %ts.%03tu cm %>a %Ss/%03>Hs %rm %ru
access_log /var/log/squid/access.log cm
logfile_rotate 1
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid

# Disable caching — this is a policy proxy, not a cache
cache deny all

# DNS settings
dns_nameservers 127.0.0.11
dns_timeout 5 seconds
positive_dns_ttl 1 minutes

# ACL: always allow the proxy container itself to function
acl localhost src 127.0.0.1/32
acl to_localhost dst 127.0.0.0/8

# ACL: Docker internal network (manager communication).
# IMPORTANT: keep this to 172.16.0.0/12 (Docker bridge subnets) ONLY.
# 192.168.0.0/16 and 10.0.0.0/8 were REMOVED (2026-07-07): those ranges let
# RESTRICTED instances reach the physical LAN (router, other hosts) via the
# proxy, defeating the network policy — it blocked the public internet but
# left the home network wide open. All CM services live on 172.27.x, so
# 172.16/12 is sufficient for legitimate internal (LiteLLM/manager) traffic.
acl docker_internal dst 172.16.0.0/12

# Always allow internal Docker traffic (manager API, LiteLLM, etc.)
http_access allow docker_internal

# Only tunnel to 443 and only proxy plain HTTP to 80/443. Before this, an
# allowlisted host could be used as a tunnel to any port.
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports

# Include per-container ACL files (generated by the manager)
# Each file defines: acl src_<id> src <container-ip>
#                     acl hosts_<id> dstdomain <host1> <host2> ...
#                     http_access allow src_<id> hosts_<id>
include /etc/squid/acl/*.acl

# Default: deny everything else
http_access deny all
