model_list:
  # Local Ollama models (3090 GPU)
  # num_ctx 32768 on every cm-ollama route: 8192 silently truncates prompts over
  # ~8k tokens and the whole budget goes to reasoning (empty answers). One value on
  # all routes, or Ollama reloads the model whenever callers disagree. Measured at
  # 22.0 of 24 GB on the 3090 (2026-10-07).
  - model_name: qwen3-30b-a3b
    litellm_params:
      model: ollama_chat/qwen3:30b-a3b
      api_base: http://cm-ollama:11434
      num_ctx: 32768
      num_batch: 1024


  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini-1
      api_key: os.environ/AZURE_AI_API_KEY
      api_base: os.environ/AZURE_AI_API_BASE

  - model_name: gpt-chat-latest
    litellm_params:
      model: openai/gpt-chat-latest
      api_key: os.environ/GPTLATEST_AZURE_AI_API_KEY
      api_base: os.environ/AZURE_AI_API_BASE

  # Anthropic API (direct, $200/month credit). Routes are named anthropic/<id> because
  # the bare Claude ids above are aliases for the local Qwen3 (local-llm backend).
  # The key is user-scoped (sk-ant-usr), so every call must name the workspace.
  # List generated from GET /v1/models for that workspace on 2026-10-08.
  - model_name: anthropic/claude-fable-5-1
    litellm_params:
      model: anthropic/claude-fable-5-1
      api_key: os.environ/ANTHROPIC_API_KEY
      extra_headers:
        anthropic-workspace-id: wrkspc_EXAMPLE
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
  - model_name: anthropic/claude-fable-5
