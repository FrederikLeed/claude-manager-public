# Use Ctrl-a as prefix (easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# OSC 52 clipboard — write copied text to a file, server polls/watches it
set -g set-clipboard off
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  'tee /tmp/.tmux-clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  'tee /tmp/.tmux-clipboard'

# Terminal type — enable 256 colors and true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm*:Tc'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Status bar
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left '#[fg=#00ff00][#S] '
set -g status-right '#[fg=#888888]%Y-%m-%d %H:%M'

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
