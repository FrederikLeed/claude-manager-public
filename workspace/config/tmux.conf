# Use Ctrl-a as prefix (easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Clipboard via OSC 52 — tmux emits the clipboard escape to the outer terminal
# on copy; xterm (addon-clipboard) decodes it and writes the host clipboard.
# No file polling needed.
set -g set-clipboard on

# Terminal type — enable 256 colors and true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm*:Tc'
# Force the OSC 52 set-clipboard capability (Ms) so copy reliably emits OSC 52
# regardless of the detected outer-terminal terminfo. Hardcode the "c" (clipboard)
# selection so consumers that ignore the empty-selection form still accept it.
set -ga terminal-overrides ',*:Ms=\E]52;c;%p2%s\7'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Status bar
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left '#[fg=#00ff00][#S] '
set -g status-right '#[fg=#888888]%Y-%m-%d %H:%M'

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
